services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    pull_policy: always
    ports:
      - '8123:8123'
    volumes:
      - homeassistant-config:/config
    environment:
      TZ: ${TZ:-Europe/Warsaw}
    restart: unless-stopped
    stop_grace_period: 60s
  everdash:
    build: .
    depends_on:
      homeassistant:
        condition: service_started
    ports:
      - '8095:8095'
    volumes:
      - everdash-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8095/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  homeassistant-config:
  everdash-data:
