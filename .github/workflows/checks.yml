name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run code checks and unit tests
        run: npm run check

      - name: Build dashboard
        run: npm run build

      - name: Check legacy browser output
        run: npm run check:compat

      - name: Typecheck and build server
        run: npm run typecheck:server && npm run build:server

      - name: Smoke test server entry
        run: npm run smoke:server

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Run isolated browser suite
        env:
          MY_HOME_BROWSER_CHANNEL: chromium
        run: npm run test:browser

      - name: Run Home Assistant builder browser suite
        env:
          MY_HOME_BROWSER_CHANNEL: chromium
        run: npm run test:admin-browser
