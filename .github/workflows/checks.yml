name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run code checks and unit tests
        run: pnpm check

      - name: Build dashboard
        run: pnpm build

      - name: Check legacy browser output
        run: pnpm check:compat

      - name: Smoke test server entry
        run: pnpm smoke:server

      - name: Install Chromium for browser tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Run isolated browser suites
        env:
          MY_HOME_BROWSER_CHANNEL: chromium
        run: pnpm test:browser
