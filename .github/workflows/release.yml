name: Release EverDash

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Verify release coordinates and versions
        run: node scripts/check-release-metadata.mjs

      - name: Set image coordinates
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "IMAGE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Run code checks and unit tests
        run: npm run check

      - name: Build dashboard and server
        run: npm run build && npm run check:compat && npm run typecheck:server && npm run build:server

      - name: Smoke test server entry
        run: npm run smoke:server

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Run isolated browser suite
        run: npm run test:browser

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build local image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: everdash:release-smoke

      - name: Verify container health and Ingress boundary
        run: |
          docker run --detach --name everdash-release-smoke --publish 8099:8099 \
            --env SUPERVISOR_TOKEN=fixture-only-supervisor-token everdash:release-smoke
          trap 'docker logs everdash-release-smoke || true; docker rm --force everdash-release-smoke || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8099/health; then
              break
            fi
            sleep 1
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8099/api/bootstrap)" = 403

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-architecture versioned image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION }}
            ${{ env.IMAGE_NAME }}:latest
